name: p119-session-qa

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-masterone}
      POSTGRES_USER: ${POSTGRES_USER:-masterone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-masterone}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-masterone} -d ${POSTGRES_DB:-masterone}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    init: true
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    env_file:
      - .env.qa
    volumes:
      - ./data:/app/data
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-masterone}:${POSTGRES_PASSWORD:-masterone}@database:5432/${POSTGRES_DB:-masterone}
      MDM_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-masterone}:${POSTGRES_PASSWORD:-masterone}@database:5432/${POSTGRES_DB:-masterone}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SESSION_WORKFLOW_ENABLED: "true"
      PAIR_ASSESSMENT_AUTO_ENABLED: "true"
      PAIR_REVIEW_MODEL_PATH: /app/data/models/pair-review-v2/manifest.json
      LLM_PAIR_ASSESSMENT_ENABLED: "false"
      LLM_SEMANTIC_ENABLED: "false"
      SEMANTIC_ADDRESS_ENABLED: "false"
      R2_ENDPOINT_URL: ""
      R2_ACCESS_KEY_ID: ""
      R2_SECRET_ACCESS_KEY: ""
      R2_BUCKET: ""
      WORK_DIR: /app/data/work
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    init: true
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    command: ["python", "-m", "masterone.mdm.resolution_worker"]
    env_file:
      - .env.qa
    volumes:
      - ./data:/app/data
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-masterone}:${POSTGRES_PASSWORD:-masterone}@database:5432/${POSTGRES_DB:-masterone}
      MDM_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-masterone}:${POSTGRES_PASSWORD:-masterone}@database:5432/${POSTGRES_DB:-masterone}
      SESSION_WORKFLOW_ENABLED: "true"
      PAIR_ASSESSMENT_AUTO_ENABLED: "true"
      PAIR_REVIEW_MODEL_PATH: /app/data/models/pair-review-v2/manifest.json
      LLM_PAIR_ASSESSMENT_ENABLED: "false"
      LLM_SEMANTIC_ENABLED: "false"
      SEMANTIC_ADDRESS_ENABLED: "false"
      R2_ENDPOINT_URL: ""
      R2_ACCESS_KEY_ID: ""
      R2_SECRET_ACCESS_KEY: ""
      R2_BUCKET: ""
      WORK_DIR: /app/data/work
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    # The shared image's HTTP probe applies only to the API process.
    healthcheck:
      disable: true

  frontend:
    init: true
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8001}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
