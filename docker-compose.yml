services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-masterone}
      POSTGRES_USER: ${POSTGRES_USER:-masterone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-masterone}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-masterone} -d ${POSTGRES_DB:-masterone}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    ports:
      - "${BACKEND_PORT:-8101}:8101"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      APP_ENV: ${APP_ENV:-development}
      MDM_EMBEDDED_WORKER_ENABLED: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      MDM_DATABASE_PROFILE: local
      MDM_DATABASE_URL_LOCAL: postgresql+psycopg://${POSTGRES_USER:-masterone}:${POSTGRES_PASSWORD:-masterone}@database:5432/${POSTGRES_DB:-masterone}
      MDM_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-masterone}:${POSTGRES_PASSWORD:-masterone}@database:5432/${POSTGRES_DB:-masterone}
      WORK_DIR: /app/data/work
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8101/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # The backend starts its own worker; this service runs an additional worker on the same DB queue.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    command: ["python", "-m", "masterone.mdm.resolution_worker"]
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      APP_ENV: ${APP_ENV:-development}
      MDM_DATABASE_PROFILE: local
      MDM_DATABASE_URL_LOCAL: postgresql+psycopg://${POSTGRES_USER:-masterone}:${POSTGRES_PASSWORD:-masterone}@database:5432/${POSTGRES_DB:-masterone}
      MDM_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-masterone}:${POSTGRES_PASSWORD:-masterone}@database:5432/${POSTGRES_DB:-masterone}
      WORK_DIR: /app/data/work
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    # The shared image's HTTP probe applies only to the API process.
    healthcheck:
      disable: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8101}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
