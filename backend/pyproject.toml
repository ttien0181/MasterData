[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "masterone-backend"
version = "0.1.0"
description = "MasterOne API and MDM services"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.28.0",
  "psutil==7.2.2",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.1",
  "python-multipart>=0.0.20",
  "alembic>=1.14.0",
  "pwdlib[argon2]>=0.3.0",
  "email-validator>=2.3.0",
  "boto3>=1.35.0",
  "rapidfuzz>=3.0.0",
  "scikit-learn>=1.4.0",
  "pyyaml>=6.0",
  "pyarrow>=15.0.0",  "duckdb>=1.0.0",  "splink==5.0.0", "pandas>=2.0.0",
  "python-json-logger>=2.0.0",
]

[project.optional-dependencies]
sample-chat = ["langchain>=0.3.0", "langchain-openai>=0.3.0", "langgraph>=0.2.0"]
matching-agents-supervisor = ["psutil==7.2.2"]
dev = [
  "ruff>=0.8.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.28.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["masterone*"]

[tool.setuptools.package-data]
"masterone.mdm" = ["input_contract_v*.json", "config/*.yaml"]
